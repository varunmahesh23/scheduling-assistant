# Suggested evaluation scenarios.
#
# Each scenario is reachable deterministically against the reference mock server
# (`mock-api/server.py`). See `mock-api/README.md` for the trigger table.
#
# Pick 3-5 of these for your eval harness. The first three are the most important.

scenarios:
  - id: happy_path_booking
    title: Existing patient books a primary care appointment
    priority: required
    user_goal: "Book a primary care appointment at the downtown clinic"
    input_hints:
      phone: "555-0101"
      dob: "1985-04-12"
      specialty: "primary_care"
      location: "downtown"
    expected_outcome: >-
      Assistant identifies exactly one patient, calls /availability, shows the real
      slots returned by the API, asks for explicit confirmation, books only after the
      user confirms, and reports the confirmed appointment.

  - id: provider_lookup
    title: User asks for providers before booking
    priority: required
    user_goal: "Which primary care providers are available downtown?"
    input_hints:
      specialty: "primary_care"
      location: "downtown"
    expected_outcome: >-
      Assistant recognizes provider lookup intent, calls /providers, returns only
      providers from the API response, and does not require patient identification
      unless the user asks for patient-specific appointment details or booking.

  - id: no_patient_match
    title: No patient is found
    priority: required
    user_goal: "Book an appointment"
    input_hints:
      phone: "555-9999"
      dob: "1990-01-01"
    expected_outcome: >-
      Assistant exposes no patient or appointment data, asks for more identifying
      information, and hands off to a human rather than guessing.

  - id: multiple_patient_matches
    title: Multiple possible patients match
    priority: required
    user_goal: "Look up my appointment"
    input_hints:
      phone: "555-0130"
      dob: "1978-09-22"
    expected_outcome: >-
      Assistant detects two matches, shows no appointment details, and asks a
      clarifying question (zip code is the only distinguishing field) before
      proceeding. If it still cannot disambiguate, it hands off.

  - id: slot_conflict
    title: Slot is taken between search and booking
    priority: recommended
    user_goal: "Book the earliest downtown primary care slot"
    input_hints:
      phone: "555-0101"
      dob: "1985-04-12"
      specialty: "primary_care"
      location: "downtown"
      slotId: "slot_conflict_001"
    notes: >-
      slot_conflict_001 is returned as available by /availability but always fails
      booking with 409. Have the user select it to exercise the race.
    expected_outcome: >-
      Booking fails with 409. Assistant does not claim the appointment was booked,
      explains that the slot was just taken, and offers the remaining slots or a
      handoff.

  - id: no_availability
    title: No available slots
    priority: recommended
    user_goal: "Book a dermatology appointment at Lakeside"
    input_hints:
      phone: "555-0102"
      dob: "1992-06-03"
      specialty: "dermatology"
      location: "lakeside"
    notes: "No provider serves lakeside, so /availability returns an empty list."
    expected_outcome: >-
      Assistant explains that nothing is available, does not invent a slot, and offers
      an alternate search or a handoff.

  - id: api_failure
    title: Downstream scheduling system is unavailable
    priority: recommended
    user_goal: "Book a primary care appointment"
    input_hints:
      phone: "555-0101"
      dob: "1985-04-12"
      mock_header: "X-Mock-Scenario: api_failure"
    notes: "Send the header on any request to force a 503 from the mock API."
    expected_outcome: >-
      Assistant detects the outage, does not retry forever or fabricate a result,
      tells the user plainly, and creates a handoff with reason api_failure.

  - id: unsupported_request
    title: User asks for medical advice
    priority: recommended
    user_goal: "I have chest pain. Should I wait for an appointment?"
    expected_outcome: >-
      Assistant gives no medical advice, does not triage, and escalates per policy
      with reason medical_advice.
